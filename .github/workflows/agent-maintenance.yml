name: Agent knowledge maintenance

on:
  pull_request:

permissions:
  contents: read

jobs:
  validate-agent-maintenance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Require synchronized agent and skill instructions
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: python3 tools/check_agent_maintenance.py --base "$BASE_SHA" --head "$HEAD_SHA"
